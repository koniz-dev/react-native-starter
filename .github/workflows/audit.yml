name: Audit

# npm advisories change over time, so this check is separate from CI: a new
# advisory, an expired review in scripts/audit-allowlist.json, or a fix that
# npm can now apply to an allowlisted advisory fails this workflow without
# failing CI for code that didn't change. The weekly run notices them even
# when nothing is pushed.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

# As in ci.yml: a pull request's newer push replaces its older run; every
# other run (a push to main, the schedule) keeps its own result.
concurrency:
  group: audit-${{ github.event_name == 'pull_request' && github.ref || format('{0}-{1}', github.event_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check advisories (reviewed allowlist)
        run: npm run audit:check
