name: Audit

# npm advisories change over time, so this check is separate from CI: a new
# advisory, an expired review in scripts/audit-allowlist.json, or a fix that
# npm can now apply to an allowlisted advisory fails this workflow without
# failing CI for code that didn't change. The weekly run notices them even
# when nothing is pushed.
on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check advisories (reviewed allowlist)
        run: npm run audit:check
