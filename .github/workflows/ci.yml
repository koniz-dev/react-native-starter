name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Run Jest tests
        run: npm run test:ci

      - name: Expo Doctor
        run: npx expo-doctor

      - name: Audit production dependencies (reviewed allowlist)
        run: npm run audit:check

      - name: Export web build
        run: npx expo export --platform web --output-dir dist

      # Last, because it adds packages to node_modules: the state-management
      # recipes and the TanStack Query example need their libraries to
      # compile (not saved to package.json).
      - name: Check docs (snippets compile, paths and scripts exist)
        run: |
          npm install --no-save zustand@5 @reduxjs/toolkit@2 react-redux@9 jotai@3 @tanstack/react-query@5
          npm run docs:check
