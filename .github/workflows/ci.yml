name: CI

# Verifies the commit itself with what the repository pins: lockfiles, the
# Node version in .nvmrc, the runner image, and actions by commit. An
# unchanged commit doesn't start failing when a package is published.
# Checks that change with time (npm advisories) are in audit.yml.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its older run; every push to main
# keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Run Jest tests
        run: npm run test:ci

      - name: Expo Doctor (against the installed Expo SDK)
        run: npm run doctor

      - name: Export web build
        run: npm run export:web -- --output-dir dist

      # Jest and the web export resolve only some platform files: bundling
      # for iOS and Android catches a broken import in an .ios/.android file.
      - name: Bundle for iOS and Android
        run: APP_VARIANT=production EXPO_PUBLIC_APP_ENV=production npx expo export --platform ios --platform android --output-dir dist/native

      - name: Check docs (snippets compile, paths and scripts exist)
        run: |
          # @recipes remove-block-start
          # The state-management recipes and the TanStack Query example need
          # their libraries to compile. They are pinned, with their own
          # dependencies, in docs/recipes/package-lock.json (not the app's
          # package.json) and linked into node_modules for tsc.
          npm ci --prefix docs/recipes --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          for pkg in $(node -p "Object.keys(require('./docs/recipes/package.json').dependencies).join(' ')"); do
            mkdir -p "node_modules/$(dirname "$pkg")"
            ln -sfn "$PWD/docs/recipes/node_modules/$pkg" "node_modules/$pkg"
          done
          # @recipes remove-block-end
          npm run docs:check
