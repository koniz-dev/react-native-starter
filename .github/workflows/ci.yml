name: CI

# Verifies the commit itself with the versions pinned in the repository (the
# lockfile, and exact versions for the recipe libraries below), so an
# unchanged commit doesn't start failing when a package is published.
# Checks that change with time (npm advisories) are in audit.yml.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Run Jest tests
        run: npm run test:ci

      - name: Expo Doctor (against the installed Expo SDK)
        run: npm run doctor

      - name: Export web build
        run: npx expo export --platform web --output-dir dist

      - name: Check docs (snippets compile, paths and scripts exist)
        run: |
          # @recipes remove-block-start
          # The state-management recipes and the TanStack Query example need
          # their libraries to compile (not saved to package.json). This step
          # runs last because of that install.
          npm install --no-save zustand@5.0.15 @reduxjs/toolkit@2.13.0 react-redux@9.3.0 jotai@3.0.1 @tanstack/react-query@5.104.2
          # @recipes remove-block-end
          npm run docs:check
