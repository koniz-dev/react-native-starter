name: CI

# Verifies the commit itself with what the repository pins: lockfiles, the
# Node version in .nvmrc, the runner image, and actions by commit. An
# unchanged commit doesn't start failing when a package is published.
# Checks that change with time (npm advisories) are in audit.yml.
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its older run; every push to main
# keeps its own result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Type-check
        run: npm run type-check

      - name: Run Jest tests
        run: npm run test:ci

      - name: Expo Doctor (against the installed Expo SDK)
        run: npm run doctor

      - name: Export web build
        run: npx expo export --platform web --output-dir dist

      - name: Check docs (snippets compile, paths and scripts exist)
        run: |
          # @recipes remove-block-start
          # The state-management recipes and the TanStack Query example need
          # their libraries to compile. They are pinned, with their own
          # dependencies, in docs/recipes/package-lock.json (not the app's
          # package.json) and linked into node_modules for tsc.
          npm ci --prefix docs/recipes --legacy-peer-deps --ignore-scripts --no-audit --no-fund
          for pkg in $(node -p "Object.keys(require('./docs/recipes/package.json').dependencies).join(' ')"); do
            mkdir -p "node_modules/$(dirname "$pkg")"
            ln -sfn "$PWD/docs/recipes/node_modules/$pkg" "node_modules/$pkg"
          done
          # @recipes remove-block-end
          npm run docs:check
