name: E2E (Android, manual)

# Runs the Maestro flows in .maestro/ on an Android emulator with Expo Go.
# Manual only: an emulator run takes far longer than the verify job.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-android:
    name: Maestro on Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MAESTRO_VERSION: '2.11.0'
      MAESTRO_SHA256: '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java 17 (Maestro)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Configure the app (demo backends)
        run: cp .env.example .env

      - name: Install the Maestro CLI (release zip, checksum verified)
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Download Expo Go for the project's SDK
        run: |
          url=$(curl -fsSL https://api.expo.dev/v2/versions/latest \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const d=j.data??j;process.stdout.write(d.sdkVersions['57.0.0'].androidClientUrl)})")
          echo "Expo Go: $url"
          curl -fsSL -o expo-go.apk "$url"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r expo-go.apk
            npm run test:e2e:android

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-results
          path: e2e-results/android
          if-no-files-found: ignore
