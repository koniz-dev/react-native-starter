name: E2E (Android, manual)

# Runs the Maestro flows in .maestro/ on an Android emulator, in Expo Go or
# in a native debug build of the development variant.
# Manual only: an emulator run takes far longer than the verify job.
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to test: expo-go, or native-debug (prebuild + Gradle assembleDebug)'
        type: choice
        options:
          - expo-go
          - native-debug
        default: expo-go

permissions:
  contents: read

jobs:
  e2e-android:
    name: Maestro on Android emulator (${{ inputs.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MAESTRO_VERSION: '2.11.0'
      MAESTRO_SHA256: '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java 17 (Maestro)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Configure the app (demo backends)
        run: cp .env.example .env

      - name: Install the Maestro CLI (release zip, checksum verified)
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Download Expo Go for the project's SDK
        if: inputs.app == 'expo-go'
        run: |
          url=$(curl -fsSL https://api.expo.dev/v2/versions/latest \
            | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>{const j=JSON.parse(s);const d=j.data??j;process.stdout.write(d.sdkVersions['57.0.0'].androidClientUrl)})")
          echo "Expo Go: $url"
          curl -fsSL -o app.apk "$url"

      # A debug build without a dev client: it loads the bundle from Metro on
      # localhost:8081 (adb reverse) and opens with its own URL scheme.
      - name: Build the native debug app (development variant)
        if: inputs.app == 'native-debug'
        run: |
          npm run prebuild:development -- --platform android
          (cd android && ./gradlew assembleDebug -PreactNativeArchitectures=x86_64)
          cp android/app/build/outputs/apk/debug/app-debug.apk app.apk
          echo "E2E_APP_ID=com.example.rnstarter.dev" >> "$GITHUB_ENV"
          echo "E2E_APP_URL=rnstarter-dev://" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk
            npm run test:e2e:android

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-android-${{ inputs.app }}-results
          path: e2e-results/android
          if-no-files-found: ignore
