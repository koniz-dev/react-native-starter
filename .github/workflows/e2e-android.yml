name: E2E (Android, manual)

# Runs the Maestro flows in .maestro/ on an Android emulator, in Expo Go or
# in a native debug build of the development variant.
# Manual only: an emulator run takes far longer than the verify job.
on:
  workflow_dispatch:
    inputs:
      app:
        description: 'App to test: expo-go, or native-debug (prebuild + Gradle assembleDebug)'
        type: choice
        options:
          - expo-go
          - native-debug
        default: expo-go

permissions:
  contents: read

jobs:
  e2e-android:
    name: Maestro on Android emulator (${{ inputs.app }})
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAESTRO_VERSION: '2.11.0'
      MAESTRO_SHA256: '5384593cb4e7a106489e75a821d157dd43f4e438df6bc308b72e82c685e1283a'
      # Expo Go for the project's SDK; update both on an SDK upgrade.
      EXPO_GO_VERSION: '58.0.4'
      EXPO_GO_SHA256: 'bd3d36794f3e060a1dd93bec7affdceb516294c1b33abbf63d2994f5cc66b3a6'
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Set up Java 17 (Maestro)
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm ci

      - name: Install the Maestro CLI (release zip, checksum verified)
        run: |
          curl -fsSL -o maestro.zip "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
          echo "${MAESTRO_SHA256}  maestro.zip" | sha256sum -c -
          unzip -q maestro.zip -d "$HOME"
          echo "$HOME/maestro/bin" >> "$GITHUB_PATH"

      - name: Download Expo Go (pinned, checksum verified)
        if: inputs.app == 'expo-go'
        run: |
          sdk="$(node -p "require('expo/package.json').version.split('.')[0]")"
          if [ "${EXPO_GO_VERSION%%.*}" != "$sdk" ]; then
            echo "EXPO_GO_VERSION ${EXPO_GO_VERSION} is not for SDK ${sdk}: update it and EXPO_GO_SHA256" >&2
            exit 1
          fi
          curl -fsSL -o app.apk "https://github.com/expo/expo-go-releases/releases/download/Expo-Go-${EXPO_GO_VERSION}/Expo-Go-${EXPO_GO_VERSION}.apk"
          echo "${EXPO_GO_SHA256}  app.apk" | sha256sum -c -

      # A debug build without a dev client: when it launches, it loads the
      # bundle from Metro on localhost:8081 (adb reverse), so the flows open
      # no link.
      - name: Build the native debug app (development variant)
        if: inputs.app == 'native-debug'
        run: |
          npm run prebuild:development -- --platform android
          # Gradle downloads the NDK and plugins; a download that breaks off
          # (a corrupt archive, a registry timeout) works on a second try.
          build() { (cd android && ./gradlew assembleDebug -PreactNativeArchitectures=x86_64); }
          build || { echo "Build failed; retrying once" >&2; build; }
          cp android/app/build/outputs/apk/debug/app-debug.apk app.apk
          echo "E2E_APP_ID=com.example.rnstarter.dev" >> "$GITHUB_ENV"
          # Its own scheme, not exp://: the flows open the link only for Expo Go.
          echo "E2E_APP_URL=rnstarter-dev://" >> "$GITHUB_ENV"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the flows on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk
            npm run test:e2e:android

      - name: Upload Maestro results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          retention-days: 14
          name: e2e-android-${{ inputs.app }}-results
          path: e2e-results/android
          if-no-files-found: ignore
