name: EAS Build (manual)

# Builds the app on EAS Build with a profile from eas.json and can submit a
# production build to the stores. Manual only, and inert until the
# repository has an EXPO_TOKEN secret: without one the run succeeds with a
# notice saying how to enable it. See docs/app-config.md.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Build profile in eas.json'
        type: choice
        options:
          - preview
          - production
        default: preview
      platform:
        description: 'Platform to build'
        type: choice
        options:
          - android
          - ios
          - all
        default: android
      submit:
        description: 'Submit the build to the stores (production only, with the submit profile in eas.json)'
        type: boolean
        default: false

permissions:
  contents: read

# A build or submission is never cancelled midway: a newer run for the same
# profile and platform waits for the one in progress.
concurrency:
  group: eas-build-${{ inputs.profile }}-${{ inputs.platform }}
  cancel-in-progress: false

jobs:
  build:
    name: EAS Build (${{ inputs.profile }}, ${{ inputs.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      # Pinned; raise it when eas.json needs a newer CLI.
      EAS_CLI_VERSION: '24.13.0'
      PROFILE: ${{ inputs.profile }}
      PLATFORM: ${{ inputs.platform }}
      SUBMIT: ${{ inputs.submit }}
    steps:
      - name: Check for EXPO_TOKEN
        id: token
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::notice title=EAS Build skipped::No EXPO_TOKEN secret. Create an access token at https://expo.dev/settings/access-tokens and add it as the repository secret EXPO_TOKEN (docs/app-config.md, EAS Build from GitHub Actions)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the inputs
        if: steps.token.outputs.enabled == 'true' && inputs.submit && inputs.profile != 'production'
        run: |
          echo "::error::Only production builds are submitted: eas.json has a production submit profile, and preview builds are for internal distribution."
          exit 1

      - name: Check out repository
        if: steps.token.outputs.enabled == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        if: steps.token.outputs.enabled == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # EAS CLI reads app.config.ts, which needs the installed packages.
      - name: Install dependencies
        if: steps.token.outputs.enabled == 'true'
        run: npm ci

      - name: Build on EAS
        if: steps.token.outputs.enabled == 'true'
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          args=(build --platform "$PLATFORM" --profile "$PROFILE" --non-interactive)
          if [ "$SUBMIT" = 'true' ]; then
            args+=(--auto-submit)
          fi
          npx --yes "eas-cli@${EAS_CLI_VERSION}" "${args[@]}"
