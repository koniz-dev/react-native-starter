# Opens the app in Expo Go (or a development build) at APP_URL and waits for
# Home. CLEAR_STATE=true starts from a fresh install state (signed out).
appId: ${APP_ID}
---
- runFlow:
    when:
      true: ${CLEAR_STATE == 'true'}
    commands:
      - clearState
      # iOS keeps Keychain items (the token) when app data is cleared.
      - runFlow:
          when:
            platform: iOS
          commands:
            - clearKeychain
- launchApp
# Expo Go needs the link to load the project. A native debug build loads its
# bundle from Metro by itself on launch, so it skips the link: a busy
# simulator can time out opening one (code 60), which fails the flow even as
# an optional step (Maestro skips an optional step only on its own errors,
# not on a driver's).
- runFlow:
    when:
      true: ${APP_URL.indexOf('exp://') === 0}
    commands:
      - openLink:
          link: ${APP_URL}
# Until Home is usable: reopen the link if Expo Go is still on its own home
# screen (the link can arrive before Expo Go is ready), and dismiss overlays:
# iOS's "Open in “Expo Go”?" prompt (shown for a link on a fresh simulator),
# Expo Go's developer-menu introduction and the menu itself, and
# on slow emulators a system "isn't responding" dialog: for the launcher it is
# closed (Android restarts the launcher; the app under test stays), for
# anything else Maestro taps Wait.
- repeat:
    times: 10
    while:
      notVisible:
        id: tab-home
    commands:
      - extendedWaitUntil:
          visible:
            id: tab-home
          timeout: 15000
          optional: true
      - runFlow:
          when:
            platform: iOS
            visible: Open in .*
          commands:
            - tapOn:
                text: Open
      - runFlow:
          when:
            visible: Development servers
          commands:
            - openLink:
                link: ${APP_URL}
                optional: true
      - runFlow:
          when:
            platform: Android
            visible: .*Launcher isn't responding
          commands:
            - tapOn:
                text: Close app
                optional: true
      - tapOn:
          text: Wait
          optional: true
      - tapOn:
          text: Continue
          optional: true
      # Expo Go's menu has "Go home". So does the app's own error screen,
      # next to "Try again": leave that one alone, so a crash fails fast.
      - runFlow:
          when:
            platform: Android
            visible: Go home
            notVisible: Try again
          commands:
            - back
      - runFlow:
          when:
            platform: iOS
            visible: Go home
            notVisible: Try again
          commands:
            - tapOn:
                point: 50%, 8%
            - runFlow:
                when:
                  visible: Go home
                commands:
                  - swipe:
                      start: 50%, 45%
                      end: 50%, 98%
                      duration: 300
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: Session
    timeout: 30000
