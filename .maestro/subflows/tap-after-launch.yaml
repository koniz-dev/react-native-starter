# Taps the element with id TAP_ID, the first tap after a launch, and taps it
# once more if EXPECT (a text pattern) hasn't appeared in 5 s. On a slow iOS
# simulator that first tap can be lost: never delivered to the app, or
# delivered without a press. The caller still waits for EXPECT, so a control
# that doesn't work fails the flow anyway.
appId: ${APP_ID}
---
- tapOn:
    id: ${TAP_ID}
- extendedWaitUntil:
    visible: ${EXPECT}
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible: ${EXPECT}
    commands:
      - tapOn:
          id: ${TAP_ID}
          optional: true
