# On the Login screen: signs in with the test account in MAESTRO_E2E_USERNAME
# and MAESTRO_E2E_PASSWORD (Maestro passes MAESTRO_* variables to every flow;
# never commit them), and ends once Login has closed. It handles what iOS adds
# around a sign-in: the keyboard's Go key and the "Save Password?" sheet.
appId: ${APP_ID}
---
- extendedWaitUntil:
    visible: Welcome Back
    timeout: 20000
- tapOn:
    id: login-username
- inputText: ${MAESTRO_E2E_USERNAME}
- tapOn:
    id: login-password
- inputText: ${MAESTRO_E2E_PASSWORD}
- hideKeyboard
# On iOS, hiding the keyboard can press its Go key, which already submits
# the form; tap Sign In only if the login screen is still there (a second
# submit while one runs is ignored by the screen).
- runFlow:
    when:
      visible:
        id: login-submit
    commands:
      - tapOn:
          id: login-submit
# Signed in once Login closes. iOS may offer to save the password in a sheet
# over the app; dismiss it.
- extendedWaitUntil:
    notVisible: Welcome Back
    timeout: 30000
- tapOn:
    text: Not Now
    optional: true
