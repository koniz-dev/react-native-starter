# From Home, signed out: signs in with the demo account (served by the e2e mock).
appId: ${APP_ID}
---
- waitForAnimationToEnd
- tapOn:
    id: sign-in-button
# A tap right after launch can be lost; tap again if Login hasn't opened.
- extendedWaitUntil:
    visible: Welcome Back
    timeout: 5000
    optional: true
- runFlow:
    when:
      notVisible: Welcome Back
    commands:
      - tapOn:
          id: sign-in-button
          optional: true
- extendedWaitUntil:
    visible: Welcome Back
    timeout: 20000
- tapOn:
    id: login-username
- inputText: emilys
- tapOn:
    id: login-password
- inputText: emilyspass
- hideKeyboard
# On iOS, hiding the keyboard can press its Go key, which already submits
# the form; tap Sign In only if the login screen is still there (a second
# submit while one runs is ignored by the screen).
- runFlow:
    when:
      visible:
        id: login-submit
    commands:
      - tapOn:
          id: login-submit
# iOS may offer to save the password in a sheet over the app.
- extendedWaitUntil:
    visible: (Signed in as Emily Johnson|Save Password\?)
    timeout: 30000
- tapOn:
    text: Not Now
    optional: true
- extendedWaitUntil:
    visible: Signed in as Emily Johnson
    timeout: 10000
