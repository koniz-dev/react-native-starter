# The tab bar switches between Home and Explore.
appId: ${APP_ID}
name: Tab navigation
---
- runFlow:
    file: subflows/open-app.yaml
    env:
      CLEAR_STATE: 'false'
- runFlow:
    file: subflows/tap-after-launch.yaml
    env:
      TAP_ID: tab-explore
      EXPECT: API Example
- extendedWaitUntil:
    visible: API Example
    timeout: 20000
- takeScreenshot: 02-explore-tab
- tapOn:
    id: tab-home
- assertVisible: Session
