# Back from Login returns Home: with Login's own back button (auth-back) on
# every platform, and with the system Back on Android.
appId: ${APP_ID}
name: Back from Login returns Home
---
- runFlow:
    file: subflows/open-app.yaml
    env:
      CLEAR_STATE: 'true'
- runFlow: subflows/open-login.yaml
- takeScreenshot: 06-login
- tapOn:
    id: auth-back
- extendedWaitUntil:
    visible: Not signed in
    timeout: 10000
- assertVisible:
    id: tab-home
- assertNotVisible: Welcome Back
- takeScreenshot: 06-back-home
- runFlow:
    when:
      platform: Android
    commands:
      - tapOn:
          id: sign-in-button
      - extendedWaitUntil:
          visible: Welcome Back
          timeout: 20000
      - back
      - extendedWaitUntil:
          visible: Not signed in
          timeout: 10000
      - assertNotVisible: Welcome Back
      - takeScreenshot: 06-system-back-home
