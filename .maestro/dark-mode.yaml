# Run with the device in dark mode (scripts/e2e/run.sh switches it): opens
# the app and takes screenshots to review. The dark colors themselves (tab
# bar, status bar, screens) are checked by the Jest theme tests.
appId: ${APP_ID}
name: Dark mode screenshots
tags:
  - dark
---
- runFlow:
    file: subflows/open-app.yaml
    env:
      CLEAR_STATE: 'false'
- takeScreenshot: dark-home
# @demo remove-block-start
- runFlow:
    file: subflows/tap-after-launch.yaml
    env:
      TAP_ID: tab-explore
      EXPECT: API Example
- extendedWaitUntil:
    visible: API Example
    timeout: 20000
- takeScreenshot: dark-explore
- tapOn:
    id: tab-home
# @demo remove-block-end
