# Opens the app in Expo Go (or a development build) at APP_URL and waits for
# Home. CLEAR_STATE=true starts from a fresh install state (signed out).
appId: ${APP_ID}
---
- runFlow:
    when:
      true: ${CLEAR_STATE == 'true'}
    commands:
      - clearState
      # iOS keeps Keychain items (the token) when app data is cleared.
      - runFlow:
          when:
            platform: iOS
          commands:
            - clearKeychain
- launchApp
- openLink: ${APP_URL}
# Until Home is usable: reopen the link if Expo Go is still on its own home
# screen (the link can arrive before Expo Go is ready), and dismiss overlays:
# iOS's "Open in “Expo Go”?" prompt (shown for a link on a fresh simulator),
# Expo Go's developer-menu introduction and the menu itself, and
# on slow emulators a system "isn't responding" dialog.
- repeat:
    times: 10
    while:
      notVisible:
        id: tab-home
    commands:
      - extendedWaitUntil:
          visible:
            id: tab-home
          timeout: 15000
          optional: true
      - runFlow:
          when:
            platform: iOS
            visible: Open in .*
          commands:
            - tapOn:
                text: Open
      - runFlow:
          when:
            visible: Development servers
          commands:
            - openLink: ${APP_URL}
      - tapOn:
          text: Wait
          optional: true
      - tapOn:
          text: Continue
          optional: true
      - runFlow:
          when:
            platform: Android
            visible: Go home
          commands:
            - back
      - runFlow:
          when:
            platform: iOS
            visible: Go home
          commands:
            - tapOn:
                point: 50%, 8%
            - runFlow:
                when:
                  visible: Go home
                commands:
                  - swipe:
                      start: 50%, 45%
                      end: 50%, 98%
                      duration: 300
      - waitForAnimationToEnd
- extendedWaitUntil:
    visible: Session
    timeout: 30000
