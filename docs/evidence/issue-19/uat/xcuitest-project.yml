name: UIDriver
options:
  deploymentTarget:
    iOS: '17.0'
targets:
  Host:
    type: application
    platform: iOS
    sources: [Host]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: dev.uat.host
      CODE_SIGNING_ALLOWED: NO
  UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: Host
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: dev.uat.uitests
      TEST_TARGET_NAME: Host
      CODE_SIGNING_ALLOWED: NO
