# Issue 54: failures the app handles must not raise a LogBox toast in a
# development build (Expo Go). A wrong password (DummyJSON answers 400) shows
# the Login Snackbar; a 503 on Explore shows the error state, and the tab bar
# stays tappable.
appId: ${APP_ID}
name: Handled request failures (toast checks optional)
---
- runScript:
    file: scripts/set-api-mode.js
    env:
      MODE: error
- runFlow:
    file: subflows/open-app.yaml
    env:
      CLEAR_STATE: 'true'
- extendedWaitUntil:
    visible: Not signed in
    timeout: 20000
- tapOn:
    id: sign-in-button
- extendedWaitUntil:
    visible: Welcome Back
    timeout: 20000
- tapOn:
    id: login-username
- inputText: emilys
- tapOn:
    id: login-password
- inputText: wrongpass
- hideKeyboard
- tapOn:
    id: login-submit
- extendedWaitUntil:
    visible: Invalid credentials
    timeout: 30000
- takeScreenshot: 01-wrong-password
- assertNotVisible:
    text: 'API .* failed.*'
    optional: true
# A LogBox toast stays until it is closed; the Snackbar leaves after 4 s.
- swipe:
    start: 50%, 30%
    end: 50%, 31%
    duration: 5000
- takeScreenshot: 01b-wrong-password-later
- assertNotVisible:
    text: 'API .* failed.*'
    optional: true
- back
- extendedWaitUntil:
    visible: Not signed in
    timeout: 20000
- tapOn:
    id: tab-explore
- extendedWaitUntil:
    visible: Service unavailable
    timeout: 30000
- swipe:
    start: 50%, 30%
    end: 50%, 31%
    duration: 2500
- takeScreenshot: 02-explore-503
- assertNotVisible:
    text: 'API .* failed.*'
    optional: true
# The tab bar is not covered: one tap on Home switches tabs.
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible: Not signed in
    timeout: 5000
- takeScreenshot: 03-home-after-tab-tap
